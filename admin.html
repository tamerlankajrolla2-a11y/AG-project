<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Админка — AG проект</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--bg:#0f1420;--s1:#161d2c;--s2:#1f2738;--line:#2c3549;--text:#eef2fa;--muted:#9aa6bf;--acc:#5b8cff;--ok:#3ad07f;--red:#ff6b6b;--wa:#1fae5b}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;font-size:16px;padding:10px 12px;min-width:0}
textarea{resize:vertical;line-height:1.45;font-size:14.5px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}
.fld{display:grid;gap:5px;font-size:13px;color:var(--muted);margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.fld{flex:1;min-width:120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 15px;border-radius:12px;font-weight:700;font-size:14px;background:var(--s2);border:1px solid var(--line)}
.btn.p{background:var(--acc);color:#16181d;border-color:var(--acc)}
.btn.s{height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.g{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.r{color:var(--red)}
.gate{max-width:380px;margin:12vh auto 0;padding:0 18px;text-align:center}
.gate h1{font-size:24px;margin:14px 0 6px}
.gate p{color:var(--muted);margin-bottom:18px}
.gate .fld{text-align:left}
.gate .btn{width:100%}
.mark{width:54px;height:54px;border-radius:15px;background:#1f2229;margin:0 auto;position:relative;overflow:hidden;border:1px solid #3a3f4a}
.mark:before,.mark:after{content:"";position:absolute;background:#fff3d6;box-shadow:0 0 8px 2px rgba(255,236,190,.6);border-radius:2px}
.mark:before{left:12px;right:12px;top:16px;height:3px}.mark:after{left:12px;top:16px;bottom:12px;width:3px}
.bar{position:sticky;top:0;z-index:10;background:rgba(14,15,18,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:8px;height:56px}
.bar-in b{margin-right:auto;font-size:17px}
.sv{font-size:12.5px;color:var(--muted)}.sv.ok{color:var(--ok)}.sv.err{color:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:900px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:36px;padding:0 13px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-size:14px;position:relative}
.tabs button[aria-selected=true]{background:var(--text);color:#16181d;font-weight:700}
.dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center}
h2.t{font-size:21px;margin:18px 0 12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h3.c{font-size:16px;margin-bottom:10px}
.note{background:rgba(58,208,127,.1);border:1px solid rgba(58,208,127,.35);color:#bff0d2;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{height:32px;padding:0 12px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-size:13px}
.chips button[aria-pressed=true]{background:var(--acc);color:#16181d;border-color:var(--acc);font-weight:700}
.ord{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.ord.new{border-color:rgba(255,217,138,.6)}
.oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.oh b{font-size:16px}
.bdg{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--s2)}
.bdg.calc{background:rgba(255,217,138,.15);color:var(--acc)}.bdg.zamer{background:rgba(58,208,127,.15);color:var(--ok)}
.oh time{margin-left:auto;color:var(--muted);font-size:12.5px}
.ord ul{list-style:none;margin:8px 0;font-size:14px;display:grid;gap:3px}
.ord li span{color:var(--muted)}
.st{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.st button{height:32px;padding:0 10px;border-radius:9px;background:var(--s2);font-size:12.5px}
.st button[aria-pressed=true]{background:var(--text);color:#16181d;font-weight:700}
.st .del{margin-left:auto;background:rgba(255,90,90,.12);color:#ff8f8f;border:1px solid rgba(255,90,90,.35)}
.bell{background:rgba(255,217,138,.1);border:1px solid rgba(255,217,138,.45);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:13.5px}
.bell span{flex:1}
.rep{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.rep .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rep input[type=date]{height:38px;padding:0 10px;border-radius:10px;background:var(--s2);border:1px solid var(--line);color:inherit;font:inherit}
.rep .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rep .sum div{background:var(--s2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.rep .sum b{display:block;font-size:17px;color:var(--text)}
.it{display:grid;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.it .row input{flex:1}
.sw{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;font-size:14.5px}
.sw input{width:20px;height:20px;accent-color:var(--acc)}
.ph{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.ph{grid-template-columns:repeat(3,1fr)}}
.phc{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.phc.hero{border-color:var(--acc)}
.phc img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.phc .b{padding:8px;display:grid;gap:6px}
.phc .b input{font-size:13px;padding:7px 9px}
.phc .row{gap:4px}
.phc .row button{flex:1;height:30px;border-radius:8px;background:var(--s2);font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--text);color:#16181d;font-weight:700;padding:11px 16px;border-radius:12px;transition:transform .25s;z-index:30;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0}
.cal button{aspect-ratio:1;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:700;display:grid;place-items:center;position:relative;line-height:1.1}
.cal button small{display:block;font-size:9.5px;font-weight:500;color:var(--muted)}
.cal button.busy{background:rgba(255,107,107,.16);border-color:rgba(255,107,107,.55);color:#ffb3b3}
.cal button.busy small{color:#ffb3b3}
.cal button.past{opacity:.35}
.cal button.today{outline:2px solid var(--acc)}
.cal button i{position:absolute;top:3px;right:4px;min-width:15px;height:15px;border-radius:8px;background:var(--acc);color:#16181d;font-size:10px;font-style:normal;display:grid;place-items:center;padding:0 3px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh b{font-size:16px;text-transform:capitalize}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.lg span{display:flex;align-items:center;gap:6px}.lg i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.wk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wk label{display:flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:13px;cursor:pointer}
.wk input{width:16px;height:16px;accent-color:var(--acc)}
.phc img{aspect-ratio:4/3}
.phc select{font-size:13px;padding:7px 9px}
.poster{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.poster img{width:70px;height:94px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.sv-h{display:flex;align-items:center;gap:8px}.sv-h b{flex:1;font-size:15px}.sv-h .pr{color:var(--acc);font-weight:700;font-size:14px;white-space:nowrap}
.off{opacity:.5}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <img src="img/logo.svg" alt="AG проект" width="96" style="display:block;margin:0 auto;background:#fff;border-radius:16px;padding:8px">
  <h1>Админка AG проект</h1>
  <p>Введите пароль администратора.</p>
  <label class="fld">Пароль <span class="muted">вводите английскими буквами</span><input id="gPass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  <button class="btn p" id="gateBtn" type="button">Войти</button>
  <p style="margin-top:16px"><a href="index.html">← вернуться на сайт</a></p>
</div>

<div id="app" hidden>
  <header class="bar">
    <div class="wrap bar-in"><b>Админка AG проект</b><span class="sv" id="sv"></span><button class="btn s" id="bellBtn" title="Уведомления в Telegram">🔔</button><a class="btn s" href="index.html" target="_blank" rel="noopener">Сайт ↗</a><button class="btn s" id="exit">Выйти</button></div>
    <nav class="tabs" id="tabs">
      <button data-tab="orders" aria-selected="true">Заявки<span class="dot" id="dot" hidden></span></button>
      <button data-tab="services" aria-selected="false">Услуги и цены</button>
      <button data-tab="texts" aria-selected="false">Тексты</button>
      <button data-tab="settings" aria-selected="false">Контакты</button>
      <button data-tab="admin" aria-selected="false">Админка</button>
    </nav>
  </header>
  <main class="wrap" id="view" style="padding-bottom:40px"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="js/store.js?v=1"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var money=function(n){return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₸';};
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on');},2600);}
function getPath(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k];},o);}
function setPath(o,p,v){var a=p.split('.');for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v;}
var D=null, tab='orders', orders=[], oSt='all', timer=null, seen=JSON.parse(localStorage.getItem('ag_seen')||'[]');
var MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function today(){return new Date(Date.now()+5*36e5).toISOString().slice(0,10);}
function dnice(v){if(!v)return '';var p=String(v).split('-');return (+p[2])+' '+MG[+p[1]-1];}
function dayKey(d){var x=new Date(d);return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2);}

/* вход */
function gate(){ $('#app').hidden=true; $('#gate').hidden=false; $('#gPass').focus(); }
function login(){
  var p=$('#gPass').value.trim(); if(!p) return toast('Введите пароль');
  $('#gateBtn').disabled=true;
  Store.login(p).then(boot).catch(function(e){toast(e.status===401?'Неверный пароль. Проверьте английскую раскладку':'Нет связи: '+e.message);}).then(function(){$('#gateBtn').disabled=false;});
}
$('#gateBtn').onclick=login;
$('#gPass').addEventListener('keydown',function(e){if(e.key==='Enter')login();});
$('#exit').onclick=function(){Store.logout();location.reload();};
function boot(){
  $('#gate').hidden=true; $('#app').hidden=false;
  Store.load(true).then(function(d){D=d;render();}).catch(function(e){toast('Не загрузилось: '+e.message);});
}
if(Store.authed()) boot(); else gate();

/* сохранение */
var saveT=null;
function sv(s){var el=$('#sv');el.className='sv '+s;el.textContent=s==='ok'?'✓ сохранено':s==='err'?'⚠ не сохранено':'сохраняю…';}
function touch(){ sv('busy'); clearTimeout(saveT); saveT=setTimeout(function(){ Store.save(D).then(function(){sv('ok');}).catch(function(e){sv('err');toast('Не сохранилось: '+e.message);}); },600); }

/* вкладки */
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab);});
function go(t){tab=t;[].forEach.call($('#tabs').children,function(x){x.setAttribute('aria-selected',x.dataset.tab===t);});render();window.scrollTo(0,0);}
function render(){
  clearInterval(timer); timer=null;
  ({orders:vOrders,services:vServices,texts:vTexts,settings:vSettings,admin:vAdmin})[tab]();
}
function F(label,path,o){o=o||{};var v=getPath(D,path);if(o.list)v=(v||[]).join(o.sep||', ');
  return '<label class="fld">'+label+(o.area?'<textarea data-b="'+path+'"'+(o.list?' data-list="'+(o.sep||',')+'"':'')+' rows="'+(o.rows||4)+'" placeholder="'+esc(o.ph||'')+'">'+esc(v==null?'':v)+'</textarea>':'<input data-b="'+path+'"'+(o.list?' data-list=","':'')+(o.num?' data-num="1" inputmode="numeric"':'')+' value="'+esc(v==null?'':v)+'" placeholder="'+esc(o.ph||'')+'">')+(o.hint?'<span class="muted">'+o.hint+'</span>':'')+'</label>';}
function SW(label,path){return '<label class="sw"><input type="checkbox" data-b="'+path+'"'+(getPath(D,path)?' checked':'')+'>'+label+'</label>';}

/* ===== ЗАЯВКИ ===== */
var STS=[['new','Новая'],['ok','В работе'],['done','Выполнена'],['cancel','Отмена']];
var STF=[['new','Новые'],['ok','В работе'],['done','Выполнены'],['cancel','Отмена']];
var SNAME={new:'Новая',ok:'В работе',done:'Выполнена',cancel:'Отмена'};
function vOrders(){
  $('#view').innerHTML='<h2 class="t">Заявки</h2><div class="note">Заявки с сайта приходят сюда со звуком. Если клиент выбрал WhatsApp — он ещё и пишет вам в чат.</div>'+
    '<div id="bellNote"></div>'+
    '<div class="rep"><b>📊 Отчёт за день</b><div class="row" style="margin-top:8px"><input type="date" id="rDate" value="'+today()+'"><button class="btn g s" type="button" id="rXls" style="height:38px">⬇ Скачать Excel</button></div><div class="sum" id="rSum"></div></div>'+
    '<div class="chips" id="oSt"></div><div id="olist" class="empty">Загружаю…</div>';
  loadOrders(); timer=setInterval(function(){loadOrders(true);},20000);
  Store.tgInfo().then(function(r){var el=$('#bellNote');if(el&&r.bot&&!r.chats)el.innerHTML='<div class="bell">🔔<span>Уведомления о заявках в Telegram ещё не подключены.</span><button class="btn s" type="button" data-bell="1">Подключить</button></div>';}).catch(function(){});
  $('#rDate').onchange=paintReport; $('#rXls').onclick=downloadXls;
}
function loadOrders(quiet){
  return Store.listOrders(500).then(function(l){
    l=l.filter(function(o){return o.status!=='deleted';});
    var fresh=l.filter(function(o){return o.status==='new'&&seen.indexOf(o.id)<0;});
    if(quiet&&fresh.length){toast('Новая заявка!');try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=880;o.connect(c.destination);o.start();o.stop(c.currentTime+.25);}catch(e){}}
    orders=l; seen=l.map(function(o){return o.id;}); localStorage.setItem('ag_seen',JSON.stringify(seen));
    if($('#olist')){paintOrders();paintReport();}
  }).catch(function(e){var x=$('#olist');if(x)x.textContent='Не загрузилось: '+e.message;});
}
function paintOrders(){
  var n=orders.filter(function(o){return o.status==='new';}).length; $('#dot').hidden=!n; $('#dot').textContent=n;
  $('#oSt').innerHTML=[['all','Все']].concat(STF).map(function(s){var c=s[0]==='all'?orders.length:orders.filter(function(o){return o.status===s[0];}).length;return '<button data-ost="'+s[0]+'" aria-pressed="'+(oSt===s[0])+'">'+s[1]+' '+c+'</button>';}).join('');
  var l=orders.filter(function(o){return oSt==='all'||o.status===oSt;});
  $('#olist').className=l.length?'':'empty';
  $('#olist').innerHTML=l.length?l.map(orderHTML).join(''):'Заявок пока нет.';
}
function orderHTML(o){
  var d=new Date(o.created_at), ph=String(o.phone||'').replace(/\D/g,'');
  return '<div class="ord'+(o.status==='new'?' new':'')+'"><div class="oh"><span class="bdg calc">'+esc(o.service||'Консультация')+'</span><b>'+esc(o.name||'Без имени')+'</b><time>№'+o.id+' · '+d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' · '+(o.via==='whatsapp'?'через WhatsApp':'с сайта')+'</time></div>'+
    '<ul><li><span>Телефон:</span> '+esc(o.phone||'—')+'</li>'+(o.price?'<li><span>Цена услуги:</span> от '+money(o.price)+'</li>':'')+(o.comment?'<li><span>Задача:</span> '+esc(o.comment)+'</li>':'')+'</ul>'+
    '<div class="row">'+(ph?'<a class="btn s" href="tel:+'+ph+'">📞 Позвонить</a><a class="btn s g" href="https://wa.me/'+ph+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'</div>'+
    '<div class="st">'+STS.map(function(s){return '<button data-ord="'+o.id+'" data-s="'+s[0]+'" aria-pressed="'+(o.status===s[0])+'">'+s[1]+'</button>';}).join('')+'<button class="del" data-del="'+o.id+'">🗑 Удалить</button></div></div>';
}
function dayData(day,list){var inc=list.filter(function(o){return dayKey(o.created_at)===day;});return {inc:inc,live:inc.filter(function(o){return o.status!=='cancel';})};}
function paintReport(){
  var el=$('#rSum'); if(!el)return; var R=dayData($('#rDate').value,orders);
  el.innerHTML='<div>Заявок за день<b>'+R.inc.length+'</b></div><div>С сайта<b>'+R.inc.filter(function(o){return o.via!=='whatsapp';}).length+'</b></div><div>Через WhatsApp<b>'+R.inc.filter(function(o){return o.via==='whatsapp';}).length+'</b></div>';
}
function loadXlsx(){return window.XLSX?Promise.resolve():new Promise(function(ok,no){var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=ok;sc.onerror=function(){no(new Error('нет интернета'));};document.head.appendChild(sc);});}
var HEAD=['№','Время','Откуда','Имя','Телефон','Услуга','Цена от, ₸','Задача','Статус'];
function rowOf(o){return [o.id,new Date(o.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),o.via==='whatsapp'?'WhatsApp':'Сайт',o.name||'',o.phone||'',o.service||'Консультация',+o.price||'',o.comment||'',SNAME[o.status]||o.status];}
function downloadXls(){
  var day=$('#rDate').value,b=$('#rXls'); b.disabled=true; b.textContent='Готовлю…';
  Promise.all([loadXlsx(),Store.listOrders(1000)]).then(function(r){
    var all=r[1].filter(function(o){return o.status!=='deleted';}),R=dayData(day,all),wb=XLSX.utils.book_new();
    var s1=[['Отчёт за '+dnice(day)+' '+day.slice(0,4)+' — '+(D.settings.company||'AG проект')],[],['Заявок за день',R.inc.length],['Без отмен',R.live.length],[],HEAD];
    R.inc.slice().reverse().forEach(function(o){s1.push(rowOf(o));});
    var ws=XLSX.utils.aoa_to_sheet(s1); ws['!cols']=[{wch:6},{wch:7},{wch:10},{wch:18},{wch:18},{wch:34},{wch:11},{wch:44},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws,'Заявки');
    var cnt={};R.inc.forEach(function(o){var k=o.service||'Консультация';cnt[k]=(cnt[k]||0)+1;});
    var s2=[['Услуга','Заявок']];Object.keys(cnt).sort(function(a,c){return cnt[c]-cnt[a];}).forEach(function(k){s2.push([k,cnt[k]]);});
    var ws2=XLSX.utils.aoa_to_sheet(s2); ws2['!cols']=[{wch:40},{wch:10}]; XLSX.utils.book_append_sheet(wb,ws2,'По услугам');
    XLSX.writeFile(wb,'AG-проект-отчёт-'+day+'.xlsx'); toast('Файл скачан');
  }).catch(function(e){toast('Не получилось: '+e.message);}).then(function(){b.disabled=false;b.textContent='⬇ Скачать Excel';});
}

/* ===== УСЛУГИ ===== */
var sOpen='';
function priceTxt(s){return s.price>0?(s.from?'от ':'')+money(s.price):(s.note||'по запросу');}
function vServices(){
  $('#view').innerHTML='<h2 class="t">Услуги и цены</h2><div class="note">Нажмите на услугу, чтобы изменить название, цену или описание. Изменения сразу видны на сайте.</div>'+
    D.services.map(function(s,i){var open=sOpen===s.id;
      return '<div class="card'+(s.on?'':' off')+'"><div class="sv-h"><b>'+esc(s.name)+'</b><span class="pr">'+esc(priceTxt(s))+'</span><button class="btn s" data-sopen="'+esc(s.id)+'">'+(open?'Свернуть':'Изменить')+'</button></div>'+
        (open?'<div style="margin-top:12px">'+F('Название','services.'+i+'.name')+
          '<div class="row">'+F('Цена, ₸ (0 — без цены)','services.'+i+'.price',{num:1})+'<label class="sw" style="margin:14px 0 0"><input type="checkbox" data-b="services.'+i+'.from"'+(s.from?' checked':'')+'>Писать «от»</label></div>'+
          F('Если цены нет — что написать','services.'+i+'.note',{ph:'по техническому заданию'})+
          F('Описание','services.'+i+'.desc',{area:1,rows:3})+
          '<label class="fld">Пункты (каждый с новой строки, необязательно)<textarea data-lines="services.'+i+'.items" rows="4">'+esc(s.items.join('\n'))+'</textarea></label>'+
          '<label class="sw"><input type="checkbox" data-b="services.'+i+'.on"'+(s.on?' checked':'')+'>Показывать на сайте</label>'+
          '<div class="row"><button class="btn s" data-smv="'+i+'|-1">↑ Выше</button><button class="btn s" data-smv="'+i+'|1">↓ Ниже</button><button class="btn s r" data-sdel="'+i+'" style="margin-left:auto">🗑 Удалить услугу</button></div></div>':'')+'</div>';
    }).join('')+'<button class="btn p" id="sadd">+ Добавить услугу</button>';
}

/* ===== ТЕКСТЫ ===== */
function lines(path,val){return '<textarea data-lines="'+path+'" rows="5">'+esc((val||[]).join('\n'))+'</textarea>';}
function vTexts(){
  $('#view').innerHTML='<h2 class="t">Тексты сайта</h2>'+
    '<div class="card"><h3 class="c">Первый экран</h3>'+F('Надпись сверху','hero.over')+F('Заголовок (часть после «—» будет синей)','hero.title')+F('Текст','hero.text',{area:1,rows:4})+
      '<label class="fld">Плашки под кнопками — каждая с новой строки'+lines('hero.badges',D.hero.badges)+'</label>'+
      '<label class="fld">Список в карточке «изготовит для вас» — каждый пункт с новой строки'+lines('hero.card',D.hero.card)+'</label></div>'+
    '<div class="card"><h3 class="c">Блок «Под ключ»</h3>'+SW('Показывать блок','turnkey.on')+F('Заголовок','turnkey.title')+F('Текст','turnkey.text',{area:1,rows:3})+'</div>'+
    '<div class="card"><h3 class="c">Как работаем</h3><label class="fld">Каждый шаг с новой строки: название | описание<textarea data-blocks="steps" data-keys="t,d" rows="5">'+esc(D.steps.map(function(x){return x.t+' | '+x.d;}).join('\n'))+'</textarea></label></div>'+
    '<div class="card"><h3 class="c">О нас</h3>'+F('Заголовок','about.title')+F('Текст (каждый абзац с новой строки)','about.text',{area:1,rows:6})+'</div>';
}

/* ===== КОНТАКТЫ ===== */
function vSettings(){
  $('#view').innerHTML='<h2 class="t">Контакты и компания</h2>'+
    '<div class="card"><h3 class="c">Компания</h3>'+F('Название','settings.company')+F('Руководитель','settings.director')+F('Должность','settings.role')+F('Способы оплаты (через запятую)','settings.pay',{list:1})+'</div>'+
    '<div class="card"><h3 class="c">Связь</h3>'+F('Телефоны (через запятую)','settings.phones',{list:1})+F('WhatsApp для заявок (только цифры)','settings.wa',{ph:'77082047851'})+F('Instagram (без @)','settings.instagram')+'</div>'+
    '<div class="card"><h3 class="c">Адрес</h3><div class="row">'+F('Город','settings.city')+F('Адрес','settings.address')+'</div>'+F('Уточнение','settings.addressNote',{ph:'здание ЦОН'})+F('Время работы','settings.hours',{ph:'Пн–Пт 9:00–18:00',hint:'Пустое поле — не показывается на сайте.'})+F('Ссылка на 2ГИС','settings.gis')+'</div>'+
    '<div class="card" id="tgCard"><h3 class="c">🔔 Уведомления в Telegram</h3><p class="muted" id="tgSt">Проверяю…</p></div>';
  paintTg();
}
function paintTg(){
  Store.tgInfo().then(function(r){
    var el=$('#tgCard'); if(!el)return;
    if(!r.bot){$('#tgSt').textContent='Бот уведомлений ещё не настроен. Напишите разработчику сайта.';return;}
    el.innerHTML='<h3 class="c">🔔 Уведомления в Telegram</h3>'+
      '<p class="muted">Когда клиент оставляет заявку на сайте, вам в Telegram сразу приходит сообщение: имя, телефон, услуга и задача. Прямо там можно нажать «Принят» или «Отмена».</p>'+
      '<p style="margin:10px 0"><b>'+(r.chats?'✅ Подключено: '+r.chats+' '+(r.chats===1?'чат':'чата'):'Пока не подключено')+'</b></p>'+
      '<div class="row"><button class="btn g" type="button" id="tgOn">'+(r.chats?'Подключить ещё телефон':'Подключить Telegram')+'</button>'+(r.chats?'<button class="btn s" type="button" id="tgOff">Отключить все</button>':'')+'</div>'+
      '<p class="muted" style="margin-top:8px">Нажмите кнопку на телефоне, где установлен Telegram, — откроется бот @'+esc(r.bot)+'. Нажмите «Старт» (Start), и всё. Ссылка действует 15 минут.</p>';
    $('#tgOn').onclick=function(){var w=window.open('about:blank','_blank');Store.tgLink().then(function(x){if(w)w.location.href=x.url;else location.href=x.url;toast('После «Старт» в боте вернитесь сюда');setTimeout(paintTg,15000);}).catch(function(e){if(w)w.close();toast('Ошибка: '+e.message);});};
    if($('#tgOff'))$('#tgOff').onclick=function(){if(!confirm('Отключить уведомления во всех чатах?'))return;Store.tgOff().then(paintTg);};
  }).catch(function(e){var x=$('#tgSt');if(x)x.textContent='Не загрузилось: '+e.message;});
}

/* ===== АДМИНКА ===== */
function vAdmin(){
  $('#view').innerHTML='<h2 class="t">Админка</h2><div class="note">✅ Сайт подключён к серверу: всё, что меняете здесь, сразу видно на сайте, заявки приходят сюда с любого устройства.</div>'+
    '<div class="card"><h3 class="c">🔑 Пароль</h3><p class="muted" style="margin-bottom:10px">Общий для всех устройств. Английские буквы и цифры, минимум 6 символов.</p>'+
      '<label class="fld">Новый пароль<input id="p1" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false"></label>'+
      '<label class="fld">Ещё раз<input id="p2" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false"></label><button class="btn" id="savePass">Сменить пароль</button></div>'+
    '<div class="card"><h3 class="c">📄 Данные из файла</h3><p class="muted" style="margin-bottom:10px">Вернёт услуги и тексты к версии из файла data/site.json.</p><button class="btn r" id="reset">Взять из файла</button></div>'+
    '<div class="card"><h3 class="c">🚪 Выход</h3><p class="muted" style="margin-bottom:10px">Вход держится 12 часов.</p><button class="btn" id="exit2">Выйти</button></div>';
}

/* ===== события ===== */
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.b){var v;if(el.type==='checkbox')v=el.checked;else if(el.dataset.num)v=+String(el.value).replace(/\s/g,'')||0;else if(el.dataset.list)v=el.value.split(/,/).map(function(x){return x.trim();}).filter(Boolean);else v=el.value;setPath(D,el.dataset.b,v);touch();}
  else if(el.dataset.lines){setPath(D,el.dataset.lines,el.value.split('\n').map(function(x){return x.trim();}).filter(Boolean));touch();}
  else if(el.dataset.blocks){var ks=el.dataset.keys.split(',');D[el.dataset.blocks]=el.value.split('\n').filter(function(x){return x.trim();}).map(function(line){var p=line.split('|').map(function(x){return x.trim();}),o={};ks.forEach(function(k,i){o[k]=i===ks.length-1?p.slice(i).join(' | '):(p[i]||'');});return o;});touch();}
});
document.addEventListener('change',function(e){var el=e.target;if(el.type==='checkbox'&&el.dataset.b){setPath(D,el.dataset.b,el.checked);touch();if(tab==='services')vServices();}});
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t)return;
  if(t.dataset.ost){oSt=t.dataset.ost;return paintOrders();}
  if(t.dataset.del){var did=t.dataset.del;if(!confirm('Удалить эту заявку? Её не будет в списке и в отчёте.'))return;Store.setStatus(did,'deleted').then(function(){orders=orders.filter(function(o){return String(o.id)!==did;});paintOrders();paintReport();toast('Удалено');}).catch(function(err){toast('Не вышло: '+err.message);});return;}
  if(t.dataset.bell||t.id==='bellBtn'){go('settings');setTimeout(function(){var c=$('#tgCard');if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.style.outline='2px solid #5b8cff';setTimeout(function(){c.style.outline='';},2500);}},300);return;}
  if(t.dataset.ord){var id=t.dataset.ord,s=t.dataset.s;Store.setStatus(id,s).then(function(){orders.forEach(function(o){if(String(o.id)===id)o.status=s;});paintOrders();}).catch(function(err){toast('Не вышло: '+err.message);});return;}
  if(t.dataset.sopen){sOpen=sOpen===t.dataset.sopen?'':t.dataset.sopen;return vServices();}
  if(t.dataset.smv){var q=t.dataset.smv.split('|'),i=+q[0],j=i+(+q[1]);if(j<0||j>=D.services.length)return;var x=D.services[i];D.services[i]=D.services[j];D.services[j]=x;touch();return vServices();}
  if(t.dataset.sdel){var sd=D.services[+t.dataset.sdel];if(!confirm('Удалить услугу «'+sd.name+'»?'))return;D.services.splice(+t.dataset.sdel,1);touch();toast('Услуга удалена');return vServices();}
  if(t.id==='sadd'){var nid='s'+Date.now().toString(36);D.services.push({id:nid,name:'Новая услуга',price:0,from:true,note:'',desc:'',items:[],on:true});sOpen=nid;touch();vServices();setTimeout(function(){window.scrollTo(0,document.body.scrollHeight);},50);return;}
  if(t.id==='savePass'){var p1=$('#p1').value.trim(),p2=$('#p2').value.trim();if(p1.length<6)return toast('Минимум 6 символов');if(p1!==p2)return toast('Пароли не совпадают');if(/[а-яё]/i.test(p1))return toast('Только английские буквы и цифры');
    return Store.changePassword(p1).then(function(){toast('Пароль изменён, войдите заново');setTimeout(function(){Store.logout();location.reload();},1500);}).catch(function(err){toast('Не вышло: '+err.message);});}
  if(t.id==='reset'){if(!confirm('Заменить услуги и тексты версией из файла?'))return;return Store.reset().then(function(d){D=d;toast('Готово');render();}).catch(function(err){toast('Не вышло: '+err.message);});}
  if(t.id==='exit2'){Store.logout();location.reload();}
});
})();
</script>
